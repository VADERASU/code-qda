<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · code-qda</title>
<link rel="stylesheet" href="/static/auth.css">
</head>
<body data-page="login">
<main class="card">
  <p class="wordmark">code-qda</p>
  <h1>Sign in</h1>
  <form id="login-form" novalidate>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit">Sign in</button>
    <p id="error" class="error" role="alert" hidden></p>
  </form>
  <p class="foot">Accounts are by invitation. Forgot your password? Ask the person who invited you for a reset link.</p>
</main>
<script type="module" src="/static/auth.js"></script>
</body>
</html>
