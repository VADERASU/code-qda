<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects · code-qda</title>
<link rel="stylesheet" href="/static/auth.css">
</head>
<body data-page="projects">
<header class="projects-bar">
  <div class="projects-wrap projects-bar-inner">
    <p class="projects-brand">code-qda</p>
    <div class="projects-account">
      <span id="who" class="muted"></span>
      <a id="admin-link" href="/admin" hidden>Admin</a>
      <button type="button" id="signout">Sign out</button>
    </div>
  </div>
</header>
<main class="projects-wrap projects-main">
  <div class="projects-heading">
    <h1>Your projects</h1>
    <button type="button" id="new-project" class="primary" aria-haspopup="dialog" disabled>
      <span aria-hidden="true">+</span> New project
    </button>
  </div>
  <p id="error" class="error" role="alert" hidden></p>
  <p id="status" class="notice" role="status" hidden></p>
  <div class="projects-layout">
    <div>
      <ul id="projects" class="projects" aria-label="Projects"></ul>
      <p id="no-projects" class="projects-empty muted" hidden>No projects yet.</p>
    </div>
    <aside class="sandbox-card" aria-labelledby="sandbox-title">
      <div class="sandbox-heading">
        <h2 id="sandbox-title">Sandbox</h2>
        <span class="muted">Only you</span>
      </div>
      <p class="muted">A partly coded practice interview.</p>
      <div class="sandbox-actions">
        <a id="try-coding" href="/p/sandbox/?file=practice-interview.md">Try coding <span class="project-arrow" aria-hidden="true"></span></a>
        <a href="/p/sandbox/">Open Sandbox</a>
      </div>
    </aside>
  </div>
</main>
<dialog id="new-project-dialog" aria-labelledby="new-project-title">
  <form id="create-form">
    <h2 id="new-project-title">New project</h2>
    <label for="project-name">Project name</label>
    <input id="project-name" name="name" type="text" maxlength="120" required autocomplete="off" autofocus>
    <p id="create-error" class="error" role="alert" hidden></p>
    <div class="project-dialog-actions">
      <button type="button" id="cancel-create">Cancel</button>
      <button class="primary" type="submit">Create project</button>
    </div>
  </form>
</dialog>
<script type="module" src="/static/projects.js"></script>
</body>
</html>
